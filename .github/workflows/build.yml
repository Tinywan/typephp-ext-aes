name: Build TypePHP extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: typephp-extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (.dll) (PHP ${{ matrix.php-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install PHP ${{ matrix.php-version }} and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: dom, openssl, mbstring, curl

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          composer update swoole/typephp --no-interaction --prefer-dist --no-progress
          if (-not (Test-Path -LiteralPath 'vendor\autoload.php')) { throw 'Composer did not create vendor/autoload.php.' }

      - name: Download the complete TypePHP Windows SDK
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .typephp-download | Out-Null
          gh release download --repo swoole/typephp --pattern 'tpc_*_windows_*.zip' --dir .typephp-download --clobber
          $archive = Get-ChildItem .typephp-download -Filter '*.zip' | Select-Object -First 1
          if ($null -eq $archive) { throw 'TypePHP Windows release archive was not downloaded.' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath .typephp-sdk -Force
          $sdk = Get-ChildItem .typephp-sdk -Directory | Select-Object -First 1
          if ($null -eq $sdk) { throw 'The TypePHP archive does not contain an SDK directory.' }
          "TYPEPHP_HOME=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $sdk.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          @(
            'tpc.exe',
            'php.exe',
            'composer.bat',
            'phpx\include',
            'phpx\lib\phpx.lib',
            'phpx.dll',
            'SDK\lib\php8embed.lib'
          ) | ForEach-Object {
            $required = Join-Path $sdk.FullName $_
            if (-not (Test-Path -LiteralPath $required)) { throw "Incomplete TypePHP SDK: missing $required" }
          }

      - name: Build extension with the TypePHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PHP_HOME = $env:TYPEPHP_HOME
          $env:PHPX_HOME = Join-Path $env:TYPEPHP_HOME 'phpx'
          Get-Command cl.exe | Format-List Source, Version
          Get-Command link.exe | Format-List Source, Version
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & "$env:TYPEPHP_HOME\tpc.exe" .\project.yml --php-version ${{ matrix.php-version }} --no-progress --no-color
          if (-not (Test-Path -LiteralPath 'build\typephp_ext_aes.dll')) { throw 'Expected DLL was not produced.' }

      - name: Verify Windows extension can load
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:TYPEPHP_HOME\php.exe" -n -d "extension=$PWD\build\typephp_ext_aes.dll" -r "var_dump(class_exists('security\EncryptionUtil'));"

      - name: Package Windows extension
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path build\typephp_ext_aes.dll -DestinationPath "typephp-ext-aes-php${{ matrix.php-version }}-windows-x64.zip" -Force

      - name: Upload Windows extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: "typephp-ext-aes-php${{ matrix.php-version }}-windows-x64"
          path: "typephp-ext-aes-php${{ matrix.php-version }}-windows-x64.zip"
          if-no-files-found: error

  linux:
    name: Linux x64 (.so) (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install PHP ${{ matrix.php-version }} and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: dom, openssl, mbstring, curl

      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake pkg-config libgmp-dev libmpfr-dev
          command -v php-config
          php --version
          php-config --version

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          composer update swoole/typephp --no-interaction --prefer-dist --no-progress
          test -f vendor/autoload.php
          mkdir -p vendor/swoole/typephp/vendor
          ln -sf "$GITHUB_WORKSPACE/vendor/autoload.php" vendor/swoole/typephp/vendor/autoload.php

      - name: Patch php_hash.h for C++ compatibility
        shell: bash
        run: |
          PHP_INC="$(php-config --include-dir 2>/dev/null || echo '')"
          echo "PHP include dir: $PHP_INC"
          if [ -n "$PHP_INC" ]; then
            sudo find "$PHP_INC" /usr/include -name "php_hash.h" -exec sed -i 's/static inline const php_hash_ops\* php_hash_fetch_ops/static inline const struct _php_hash_ops\* php_hash_fetch_ops/g' {} + 2>/dev/null || true
          fi

      - name: Build PHPX for the selected PHP ABI
        shell: bash
        run: |
          set -euxo pipefail
          php_home="$(php-config --prefix)"
          php_inc="$(php-config --include-dir)"
          test -f "$php_inc/main/php.h"

          EXTRA_INC=""
          for d in /usr/include /usr/local/include /usr/include/x86_64-linux-gnu; do
              [ -d "$d" ] && EXTRA_INC="$EXTRA_INC -I$d"
          done

          cmake -S vendor/swoole/phpx -B .typephp/phpx-build \
            -DCMAKE_BUILD_TYPE=Release \
            -Dphp_dir="$php_home" \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXT=OFF \
            -DCMAKE_CXX_FLAGS="$EXTRA_INC" \
            -DCMAKE_C_FLAGS="$EXTRA_INC" \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/vendor/swoole/phpx/lib"
          cmake --build .typephp/phpx-build --target phpx --parallel 2
          test -f vendor/swoole/phpx/lib/libphpx.so
          printf 'PHP_HOME=%s\n' "$php_home" >> "$GITHUB_ENV"
          printf 'PHPX_HOME=%s/vendor/swoole/phpx\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Build extension with TypePHP
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          printf 'Compiler: '; vendor/bin/tpc.php --version
          vendor/bin/tpc.php project.yml --php-version ${{ matrix.php-version }} --no-progress --no-color
          test -f build/typephp_ext_aes.so
          file build/typephp_ext_aes.so

      - name: Verify Linux extension can load
        shell: bash
        run: |
          set -euxo pipefail
          php -n -d "extension=$GITHUB_WORKSPACE/build/typephp_ext_aes.so" -r "var_dump(class_exists('security\\EncryptionUtil'));"

      - name: Package Linux extension
        shell: bash
        run: |
          tar -czvf "typephp-ext-aes-php${{ matrix.php-version }}-linux-x64.tar.gz" -C build typephp_ext_aes.so

      - name: Upload Linux extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: "typephp-ext-aes-php${{ matrix.php-version }}-linux-x64"
          path: "typephp-ext-aes-php${{ matrix.php-version }}-linux-x64.tar.gz"
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
